{% extends 'base.html' %}

{% block contenido %}
<h2>✏️ Editar Producto</h2>

<div class="card p-4">
    <form method="POST" action="/actualizar_producto">
        <input type="hidden" name="id" value="{{ producto[0] }}">

        <div class="mb-3">
            <label class="form-label">Nombre del Producto</label>
            <input type="text" name="nombre" class="form-control" value="{{ producto[1] }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Precio ($)</label>
            <input type="number" step="0.01" min="0.01" name="precio" class="form-control" value="{{ producto[2] }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Stock Actual</label>
            <input type="number" min="0" name="stock" class="form-control" value="{{ producto[3] }}" required>
        </div>

        <div class="mb-3 form-check">
            <input type="checkbox" name="aplica_2x1" class="form-check-input" id="editPromo" value="1" {% if producto[4] == 1 %}checked{% endif %}>
            <label class="form-check-label" for="editPromo">⚡ Activar promoción 2x1</label>
        </div>

        <button type="submit" class="btn btn-primary">Guardar Cambios</button>
        <a href="/productos" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
