{% extends 'base.html' %}

{% block contenido %}
<style>
    .clay-form {
        background: white;
        border-radius: 25px;
        padding: 25px;
        box-shadow: 15px 15px 40px #d1d9e6, -15px -15px 40px #ffffff;
        border: 1px solid rgba(255,255,255,0.2);
    }
    .product-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 20px;
        margin-top: 20px;
    }
    .clay-card-product {
        background: #ffffff;
        border-radius: 20px;
        padding: 20px;
        box-shadow: 10px 10px 30px #d1d9e6, -10px -10px 30px #ffffff;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }
    .btn-clay-sm {
        border-radius: 10px;
        border: none;
        box-shadow: 3px 3px 8px #bebebe, -3px -3px 8px #ffffff;
        transition: 0.2s;
    }
    .btn-clay-sm:active {
        box-shadow: inset 2px 2px 5px #bebebe, inset -2px -2px 5px #ffffff;
    }
</style>

<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>📦 Gestión de Inventario</h2>
</div>

<div class="clay-form mb-5">
    <h5 class="mb-3">➕ Nuevo Producto</h5>
    <form method="POST" action="/agregar_producto" class="row g-3 align-items-end">
        <div class="col-md-3">
            <label class="form-label text-muted small">Nombre</label>
            <input type="text" name="nombre" class="form-control rounded-pill" placeholder="Ej. Cartón de leche" required>
        </div>
        <div class="col-md-2">
            <label class="form-label text-muted small">Precio ($)</label>
            <input type="number" name="precio" class="form-control rounded-pill" placeholder="0.00" step="0.01" min="0.01" required>
        </div>
        <div class="col-md-2">
            <label class="form-label text-muted small">Stock</label>
            <input type="number" name="stock" class="form-control rounded-pill" placeholder="0" min="0" required>
        </div>
        <div class="col-md-3">
            <div class="form-check ms-2 mb-2">
                <input class="form-check-input" type="checkbox" name="aplica_2x1" id="promoCheck" value="1">
                <label class="form-check-label fw-bold text-success" for="promoCheck">⚡ ¡Aplica 2x1!</label>
            </div>
        </div>
        <div class="col-md-2">
            <button type="submit" class="btn btn-primary btn-clay-sm w-100 py-2">Agregar</button>
        </div>
    </form>
</div>

<div class="product-grid">
    {% for p in productos %}
    <div class="clay-card-product">
        <div>
            <div class="d-flex justify-content-between align-items-start mb-2">
                <h5 class="fw-bold text-dark mb-0">{{ p[1] }}</h5>
                {% if p[4] == 1 %}
                    <span class="badge bg-danger rounded-pill">2x1</span>
                {% endif %}
            </div>
            <h3 class="text-primary">${{ p[2] }}</h3>

            <p class="text-muted mb-3">
                Stock disponible:
                <span class="badge {% if p[3] <= 5 %}bg-warning text-dark{% else %}bg-light text-dark border{% endif %}">
                    {{ p[3] }} uds.
                </span>
            </p>
        </div>

        <div class="d-flex gap-2 mt-auto">
            <a href="/editar_producto/{{ p[0] }}" class="btn btn-warning btn-sm btn-clay-sm flex-grow-1 text-dark fw-bold">Editar</a>
            <a href="/eliminar_producto/{{ p[0] }}" class="btn btn-danger btn-sm btn-clay-sm flex-grow-1 fw-bold" onclick="return confirm('¿Seguro que deseas eliminar {{ p[1] }}?')">Eliminar</a>
        </div>
    </div>
    {% endfor %}
</div>

{% endblock %}
